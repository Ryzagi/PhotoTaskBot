name: android

on:
  push:
    branches: [master, main]
    paths:
      - 'clients/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --no-daemon lintDevDebug || true

      - name: Build debug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_ANDROID || '' }}
        run: ./gradlew --no-daemon :app:assembleDevDebug
