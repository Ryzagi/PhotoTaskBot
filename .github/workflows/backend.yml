name: backend

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff mypy

      - name: Lint
        run: ruff check bot tests scripts --exclude bot/app/tg_app__.py

      - name: Unit tests
        env:
          SUPABASE_JWT_SECRET: test-jwt-secret-do-not-use
          INTERNAL_AUTH_SECRET: test-internal-secret-do-not-use
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzdHViIn0.stub
          USER_EMAIL: test@example.com
          USER_PASSWORD: test
          OPENAI_API_KEY: test
          GOOGLE_API_KEY: test
        run: PYTHONPATH=. pytest tests/unit -v

      - name: Regenerate openapi.json (verify in-tree copy is up to date)
        env:
          SUPABASE_JWT_SECRET: test
          INTERNAL_AUTH_SECRET: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzdHViIn0.stub
          USER_EMAIL: test@example.com
          USER_PASSWORD: test
          OPENAI_API_KEY: test
          GOOGLE_API_KEY: test
        run: |
          PYTHONPATH=. python -m scripts.gen_openapi
          if ! git diff --exit-code -- bot/openapi.json; then
            echo "::error::bot/openapi.json is out of date — run 'make openapi' and commit."
            exit 1
          fi

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pandasolve-api:${{ github.sha }}
