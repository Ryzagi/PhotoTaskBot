org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 8.5 + Kotlin 2.0 are tested up to JDK 21. Pin to the Homebrew JDK 17
# install so builds don't accidentally pick up the system JDK 25/26.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
# Play requires targetSdk 36 (Android 16) from Aug 31 2026; AGP 8.5 only "knows"
# up to 34, so silence the compileSdk-too-new warning (the android-36 platform is
# installed and builds fine).
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
kotlin.incremental=true

# Required by Supabase SDK on older Kotlin tooling
kotlin.mpp.androidSourceSetLayoutVersion=2
