[versions]
agp = "8.5.2"
kotlin = "2.0.20"
compose-bom = "2024.09.02"
hilt = "2.52"
ksp = "2.0.20-1.0.25"
lifecycle = "2.8.6"
nav = "2.8.1"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
coil = "2.7.0"
supabase = "2.6.1"
# sentry >= 7.19 and camerax >= 1.4.1 ship 16 KB-aligned .so files — Play rejects
# uploads targeting Android 15+ whose native libs are still 4 KB aligned.
sentry = "7.22.6"
posthog = "3.5.1"
firebase-bom = "33.4.0"
math-view = "0.0.6"
timber = "5.0.1"
openapi-generator = "7.8.0"
camerax = "1.4.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
# Push (FCM): uncomment the `google-services` plugin in build.gradle.kts after
# dropping app/google-services.json from your Firebase project. See docs.
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }

[libraries]
androidx-core = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.2" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "nav" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-nav-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.1.1" }
security-crypto = { group = "androidx.security", name = "security-crypto", version = "1.1.0-alpha06" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

supabase-auth = { group = "io.github.jan-tennert.supabase", name = "gotrue-kt", version.ref = "supabase" }
supabase-compose-auth = { group = "io.github.jan-tennert.supabase", name = "compose-auth", version.ref = "supabase" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt", version.ref = "supabase" }
# Ktor HTTP engine — required by supabase-kt at runtime. We pick the OkHttp
# engine so OkHttp interceptors etc. are shared with our Retrofit client.
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version = "2.3.12" }
credentials = { group = "androidx.credentials", name = "credentials", version = "1.3.0" }
credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version = "1.3.0" }
google-id = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version = "1.1.1" }
browser = { group = "androidx.browser", name = "browser", version = "1.8.0" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

## math-view: JitPack artifact coordinates vary between releases — wire back when
## the on-device LaTeX path is needed. Today we render via plain Text (see MathBlock.kt).
# math-view = { group = "com.github.kexanie", name = "MathView", version = "0.0.6" }

sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
posthog-android = { group = "com.posthog", name = "posthog-android", version.ref = "posthog" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

junit5 = { group = "org.junit.jupiter", name = "junit-jupiter", version = "5.10.3" }
turbine = { group = "app.cash.turbine", name = "turbine", version = "1.1.0" }
mockk = { group = "io.mockk", name = "mockk", version = "1.13.12" }
